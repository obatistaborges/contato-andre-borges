
<!DOCTYPE html>

<title>André Borges | Contato</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;

  display: grid;
  place-items: center;
  padding: 24px;
  background: #f3f5f8;

p { margin: 9px 0 27px; color: #778395; font-size: 14px; }
.links { display: grid; gap: 12px; }
a {

  padding: 13px;
  border: 1px solid #dfe5ec;
  border-radius: 13px;
  color: #263b55;
  text-decoration: none;
  font-size: 15px;
  font-weight: bold;

footer { margin-top: 25px; color: #a0a9b5; font-size: 11px; }
